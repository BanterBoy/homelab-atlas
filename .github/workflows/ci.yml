name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: npm test
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t homelab-atlas:test .
      - run: docker run -d --name atlas --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 homelab-atlas:test
      - run: |
          for i in {1..20}; do curl --fail http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs atlas
          exit 1
