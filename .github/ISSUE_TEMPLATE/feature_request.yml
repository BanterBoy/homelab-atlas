name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Review the [guides](https://aiden0rchad.github.io/homelab-atlas/) first. Do not include private lab data.
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What are you trying to accomplish, and why is it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
