<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07131f"><title>Homelab Atlas</title><link rel="stylesheet" href="/styles.css"></head>
<body>
<header class="topbar"><a class="brand" href="#" aria-label="Homelab Atlas home"><span class="brand-mark">A</span> Homelab Atlas</a><label class="title-field"><span class="sr-only">Project title</span><input id="project-title" maxlength="120"></label><span id="save-status" class="status" role="status">Saved locally</span><nav aria-label="Project actions"><button id="undo" title="Undo (Ctrl/Cmd+Z)">↶ <span>Undo</span></button><button id="redo" title="Redo (Ctrl/Cmd+Shift+Z)">↷ <span>Redo</span></button><button id="import">Import</button><button id="save-json">Save project</button><button id="export-svg">SVG</button><button id="export-png" class="primary">PNG</button></nav></header>
<main class="workspace">
  <aside class="rail" aria-label="Inventory"><div class="panel-head"><div><span class="eyebrow">Inventory</span><h2>Devices</h2></div><button id="add-device" class="icon-button" aria-label="Add device">＋</button></div><div id="device-list" class="item-list"></div><div class="section-head"><h2>Network</h2><button id="add-network" class="icon-button" aria-label="Add network node">＋</button></div><div id="network-list" class="item-list"></div><button id="edit-connections" class="wide">Edit connections</button><div class="rail-bottom"><button id="sample" class="wide">Load example</button><button id="empty" class="wide danger">Start empty</button><p>Autosave stays in this browser. Save a project file for backup or sharing.</p></div></aside>
  <section class="stage" aria-label="Diagram preview"><div class="stage-tools"><button id="settings">Settings</button><button id="zoom-out" aria-label="Zoom out">−</button><output id="zoom-label">100%</output><button id="zoom-in" aria-label="Zoom in">＋</button><button id="zoom-fit">Fit</button></div><div id="canvas" tabindex="0"><div id="preview"></div></div></section>
  <aside class="inspector" aria-label="Inspector"><button id="inspector-close" aria-label="Close inspector">×</button><div id="inspector-content"></div></aside>
</main>
<input id="file-input" type="file" accept="application/json,.json" hidden>
<dialog id="device-dialog"><form method="dialog"><header><div><span class="eyebrow">New device</span><h2>Choose a template</h2></div><button value="cancel" aria-label="Close">×</button></header><div id="template-grid" class="template-grid"></div></form></dialog>
<dialog id="logo-dialog"><form method="dialog"><header><div><span class="eyebrow">Service catalog</span><h2>Add services</h2></div><button value="cancel" aria-label="Close">×</button></header><label class="search">Search local logos<input id="logo-search" type="search" autocomplete="off" placeholder="Jellyfin, backup, network…"></label><div id="logo-grid" class="logo-grid"></div><footer><button value="cancel">Cancel</button><button id="add-selected" value="default" class="primary">Add selected</button></footer></form></dialog>
<dialog id="network-dialog"><form id="network-form"><header><h2>Network node</h2><button type="button" data-close aria-label="Close">×</button></header><label>Name<input name="name" maxlength="120" required></label><label>Kind<select name="kind"><option>Internet</option><option>Router</option><option>Switch</option><option>Wi-Fi</option><option>Network</option></select></label><label>Accent<input name="accent" type="color"></label><footer><button type="button" data-close>Cancel</button><button class="primary">Save node</button></footer></form></dialog>
<dialog id="connections-dialog"><form method="dialog"><header><h2>Connections</h2><button value="cancel" aria-label="Close">×</button></header><p class="help">Named logical relationships only; no switch-port accuracy implied.</p><div id="connection-list"></div><div class="connection-add"><select id="connection-from" aria-label="From endpoint"></select><span>→</span><select id="connection-to" aria-label="To endpoint"></select><input id="connection-label" maxlength="120" placeholder="Label"><button id="connection-add" type="button">Add</button></div><footer><button value="default" class="primary">Done</button></footer></form></dialog>
<div id="toast" role="alert" aria-live="assertive"></div><script type="module" src="/app.js"></script>
</body></html>
