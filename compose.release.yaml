services:
  atlas:
    image: ghcr.io/aiden0rchad/homelab-atlas:${ATLAS_VERSION:-0.4.0}
    ports:
      - "${ATLAS_BIND:-127.0.0.1}:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
